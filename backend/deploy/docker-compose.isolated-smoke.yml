# Isolated local T10 smoke stack. Use with a unique Compose project name.
# Host ports and project-scoped volumes are separate from the regular dev stack.
services:
  mysql:
    container_name: !reset null
    environment:
      MYSQL_ROOT_PASSWORD: ${STAGE5_SMOKE_MYSQL_ROOT_PASSWORD:-local-smoke-root-not-for-production}
      MYSQL_PASSWORD: ${STAGE5_SMOKE_MYSQL_PASSWORD:-local-smoke-db-not-for-production}
    # The smoke API connects as MYSQL_USER, so probe the same identity instead
    # of relying on an ephemeral root password from the PowerShell launch shell.
    healthcheck:
      test: !override ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql -h 127.0.0.1 -u\"$$MYSQL_USER\" -D \"$$MYSQL_DATABASE\" -N -e 'SELECT 1' >/dev/null 2>&1"]
    ports: !override
      - "127.0.0.1:13308:3306"

  minio:
    container_name: !reset null
    environment:
      MINIO_ROOT_USER: ${STAGE5_SMOKE_MINIO_USER:-smoke-local}
      MINIO_ROOT_PASSWORD: ${STAGE5_SMOKE_MINIO_PASSWORD:-local-smoke-minio-not-for-production}
      MINIO_API_CORS_ALLOW_ORIGIN: ${STAGE5_SMOKE_APP_ORIGIN:-http://127.0.0.1:15173}
    ports: !override
      - "127.0.0.1:19000:9000"
      - "127.0.0.1:19001:9001"

  kafka:
    container_name: !reset null
    environment:
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://127.0.0.1:19092,CONTROLLER://kafka:9093
    ports: !override
      - "127.0.0.1:19092:9092"

  redis:
    container_name: !reset null
    environment:
      REDIS_PASSWORD: ${STAGE5_SMOKE_REDIS_PASSWORD:-local-smoke-redis-not-for-production}
    ports: !override
      - "127.0.0.1:16379:6379"

  migrate:
    image: video-share/stage5-smoke-api:local
    env_file: !override
      - ../.env.example
    environment:
      MYSQL_USER: video_share
      MYSQL_PASSWORD: ${STAGE5_SMOKE_MYSQL_PASSWORD:-local-smoke-db-not-for-production}
      MYSQL_DB: video_share
      JWT_SECRET: ${STAGE5_SMOKE_JWT_SECRET:-stage5-local-isolated-smoke-secret-not-for-production-0000000000000000}
      REDIS_PASSWORD: ${STAGE5_SMOKE_REDIS_PASSWORD:-local-smoke-redis-not-for-production}
      MINIO_ACCESS_KEY: ${STAGE5_SMOKE_MINIO_USER:-smoke-local}
      MINIO_SECRET_KEY: ${STAGE5_SMOKE_MINIO_PASSWORD:-local-smoke-minio-not-for-production}
      MINIO_ENDPOINT: minio:9000
      MINIO_PUBLIC_ENDPOINT: 127.0.0.1:19000

  api:
    image: video-share/stage5-smoke-api:local
    container_name: !reset null
    env_file: !override
      - ../.env.example
    environment:
      MYSQL_USER: video_share
      MYSQL_PASSWORD: ${STAGE5_SMOKE_MYSQL_PASSWORD:-local-smoke-db-not-for-production}
      MYSQL_DB: video_share
      JWT_SECRET: ${STAGE5_SMOKE_JWT_SECRET:-stage5-local-isolated-smoke-secret-not-for-production-0000000000000000}
      APP_ORIGIN: ${STAGE5_SMOKE_APP_ORIGIN:-http://127.0.0.1:15173}
      REDIS_PASSWORD: ${STAGE5_SMOKE_REDIS_PASSWORD:-local-smoke-redis-not-for-production}
      MINIO_ACCESS_KEY: ${STAGE5_SMOKE_MINIO_USER:-smoke-local}
      MINIO_SECRET_KEY: ${STAGE5_SMOKE_MINIO_PASSWORD:-local-smoke-minio-not-for-production}
      MINIO_ENDPOINT: minio:9000
      MINIO_PUBLIC_ENDPOINT: 127.0.0.1:19000
    ports: !override
      - "127.0.0.1:18081:8081"

  worker:
    image: video-share/stage5-smoke-worker:local
    container_name: !reset null
    env_file: !override
      - ../.env.example
    environment:
      MYSQL_USER: video_share
      MYSQL_PASSWORD: ${STAGE5_SMOKE_MYSQL_PASSWORD:-local-smoke-db-not-for-production}
      MYSQL_DB: video_share
      JWT_SECRET: ${STAGE5_SMOKE_JWT_SECRET:-stage5-local-isolated-smoke-secret-not-for-production-0000000000000000}
      REDIS_PASSWORD: ${STAGE5_SMOKE_REDIS_PASSWORD:-local-smoke-redis-not-for-production}
      MINIO_ACCESS_KEY: ${STAGE5_SMOKE_MINIO_USER:-smoke-local}
      MINIO_SECRET_KEY: ${STAGE5_SMOKE_MINIO_PASSWORD:-local-smoke-minio-not-for-production}
      MINIO_ENDPOINT: minio:9000
      MINIO_PUBLIC_ENDPOINT: 127.0.0.1:19000

  ranking-rebuild:
    image: video-share/stage5-smoke-ranking:local
    container_name: !reset null
    env_file: !override
      - ../.env.example
    environment:
      MYSQL_USER: video_share
      MYSQL_PASSWORD: ${STAGE5_SMOKE_MYSQL_PASSWORD:-local-smoke-db-not-for-production}
      MYSQL_DB: video_share
      REDIS_PASSWORD: ${STAGE5_SMOKE_REDIS_PASSWORD:-local-smoke-redis-not-for-production}
      JWT_SECRET: ${STAGE5_SMOKE_JWT_SECRET:-stage5-local-isolated-smoke-secret-not-for-production-0000000000000000}

  frontend:
    image: video-share/stage5-smoke-frontend:local
    container_name: !reset null
    ports: !override
      - "127.0.0.1:15173:80"
    volumes:
      - ../../frontend/deploy/nginx.isolated-smoke.conf:/etc/nginx/conf.d/default.conf:ro
