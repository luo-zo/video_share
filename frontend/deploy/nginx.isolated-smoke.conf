# Local-only Compose smoke config. Keep the production CSP in nginx.conf.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 32k;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: http://127.0.0.1:19000 http://localhost:19000; connect-src 'self' http://127.0.0.1:19000 http://localhost:19000; media-src 'self' blob: http://127.0.0.1:19000 http://localhost:19000; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;

    location = /healthz {
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    location ^~ /api/ {
        resolver 127.0.0.11 valid=5s ipv6=off;
        set $api_upstream api:8081;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location ~ /\. {
        return 404;
    }

    location ~* \.[a-z0-9]+$ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
